[package]
name = "cc-cost"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
ratatui = "0.30.0"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
walkdir = "2.5.0"

# `cargo run` (profil dev) reste rapide sur 2.6 Go : on optimise les deps
# (serde_json/rayon, le chemin chaud) sans ralentir la compil de notre code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
